<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEON//WAVE</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <div class="brand">
      <span class="mark">N</span>
      <div><strong>NEON//WAVE</strong><small>LIQUID GLASS · SPOTIFY</small></div>
    </div>
    <label class="toggle-row" for="theme-toggle">
      <span><b>Тема оформления</b><small>Полупрозрачный интерфейс и фон обложки</small></span>
      <input id="theme-toggle" type="checkbox">
      <i class="switch" aria-hidden="true"></i>
    </label>
    <p class="hint" id="status">Настройка применяется сразу на открытой вкладке Spotify.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
